# fly.toml app configuration file generated for renaldo on 2026-11-19T13:43:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'renaldo'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

  [build.args]
    BP_CPYTHON_VERSION = '3.11.4'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
